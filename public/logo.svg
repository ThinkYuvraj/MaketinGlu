<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 8 500 250" width="500" height="250">
  <defs>
    <style>
      .brand-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        font-size: 47px;
        letter-spacing: -0.5px;
      }
      .brand-sub {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 19px;
        letter-spacing: 4.5px;
      }
    </style>
  </defs>

  <!-- Inverted Triangle MG Crest -->
  <g transform="translate(170, 12)" fill="none" stroke="#000000">
    <!-- Outer Inverted Triangle with sharp corners -->
    <path d="M 6 8 L 154 8 L 80 108 Z" stroke-width="11" stroke-linejoin="miter" stroke-miterlimit="4" />
    
    <!-- Center dividing line -->
    <line x1="80" y1="8" x2="80" y2="94" stroke-width="10" />
    
    <!-- Left 'M' vertical strokes -->
    <line x1="36" y1="8" x2="36" y2="60" stroke-width="9" />
    <line x1="58" y1="8" x2="58" y2="60" stroke-width="9" />

    <!-- Right 'G' inner spur and crossbar -->
    <path d="M 124 40 L 124 64 L 88 64" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter" />
  </g>

  <!-- Brand Wordmark: MARKETINGLU ® -->
  <text x="250" y="198" text-anchor="middle" fill="#000000" class="brand-title">
    MARKETINGLU<tspan dx="3" dy="-16" font-size="22" font-weight="800">®</tspan>
  </text>

  <!-- Brand Subtitle: Digital Brand Management -->
  <text x="250" y="240" text-anchor="middle" fill="#111827" class="brand-sub">
    Digital Brand Management
  </text>
</svg>