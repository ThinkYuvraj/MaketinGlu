<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280">
  <defs>
    <style>
      .brand-title-white {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .brand-sub-white {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 19px;
        letter-spacing: 4px;
      }
    </style>
  </defs>

  <!-- Inverted Triangle MG Crest -->
  <g transform="translate(170, 16)" fill="none" stroke="#38bdf8">
    <!-- Outer Inverted Triangle with sharp corners -->
    <path d="M 6 8 L 154 8 L 80 106 Z" stroke-width="10" stroke-linejoin="miter" stroke-miterlimit="4" />
    
    <!-- Center dividing line -->
    <line x1="80" y1="8" x2="80" y2="92" stroke-width="9" />
    
    <!-- Left 'M' vertical strokes -->
    <line x1="36" y1="8" x2="36" y2="58" stroke-width="8" stroke="#ffffff" />
    <line x1="58" y1="8" x2="58" y2="58" stroke-width="8" stroke="#ffffff" />

    <!-- Right 'G' inner spur and crossbar -->
    <path d="M 124 40 L 124 64 L 88 64" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" stroke="#38bdf8" />
  </g>

  <!-- Brand Wordmark: MARKETINGLU ® -->
  <text x="250" y="200" text-anchor="middle" fill="#ffffff" class="brand-title-white">
    MARKETING<tspan fill="#38bdf8">LU</tspan><tspan dx="4" dy="-16" font-size="22" font-weight="700" fill="#94a3b8">®</tspan>
  </text>

  <!-- Brand Subtitle: Digital Brand Management -->
  <text x="250" y="242" text-anchor="middle" fill="#94a3b8" class="brand-sub-white">
    Digital Brand Management
  </text>
</svg>
